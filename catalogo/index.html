<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manos Libres — Hacé tu pedido</title>
<meta name="description" content="Comida casera de la cocina comunitaria de Manos Libres, en el CIC Barrio Movediza de Tandil. Pedí online, retirás o te lo llevamos.">
<meta name="theme-color" content="#0e0e10">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="Manos Libres — Hacé tu pedido">
<meta property="og:description" content="Comida casera de la cocina comunitaria del CIC Barrio Movediza. Retiro o envío a domicilio.">
<meta property="og:image" content="../assets/logo.png">

<link rel="icon" href="../assets/favicon.png">

<!-- El link se abre desde un celular con mala señal: las fuentes se piden con
     preconnect y display=swap para que el texto se lea antes de que lleguen. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* Identidad Manos Libres — la misma de CLAUDE.md. Esta página no comparte CSS
   con el SO a propósito: es pública, tiene que cargar sola y no arrastrar nada. */

:root {
  --bg:         #0e0e10;
  --surface:    #16161a;
  --surface-2:  #1e1e24;
  --border:     #2a2a32;

  --text:       #f2f2f5;
  --text-dim:   #9a9aa8;
  --text-faint: #6a6a78;

  --acento:     #f55b1e;   /* naranja de pedidos */
  --ok:         #1ec84a;
  --danger:     #e8185a;

  --font-title: 'Fredoka One', system-ui, sans-serif;
  --font-body:  'Nunito', system-ui, sans-serif;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;

  --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --barra-h: 88px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-weight: 700;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body { min-height: 100dvh; }
body.con-sheet { overflow: hidden; }

h1, h2 { font-family: var(--font-title); font-weight: 400; margin: 0; letter-spacing: .2px; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea { font: inherit; color: inherit; }

.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.oculto { display: none !important; }

.envoltorio { max-width: 560px; margin: 0 auto; padding: 0 var(--sp-4); }

/* ---------- Encabezado ---------- */

.hero {
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  text-align: center;
}

.hero__logo { width: 72px; height: 72px; object-fit: contain; }

.hero h1 { font-size: 1.75rem; margin-top: var(--sp-2); }

.hero__bajada {
  margin: var(--sp-2) auto 0; max-width: 34ch;
  font-size: .92rem; font-weight: 700; color: var(--text-dim);
}

.hero__donde {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; font-size: .8rem; color: var(--text-dim);
}

/* ---------- Catálogo ---------- */

.categoria {
  font-family: var(--font-title); font-size: 1.05rem;
  margin: var(--sp-5) 0 var(--sp-3);
  padding-bottom: var(--sp-2); border-bottom: 1px solid var(--border);
}

.items { display: flex; flex-direction: column; gap: var(--sp-3); }

.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: border-color .15s;
}

.item--elegido { border-color: var(--acento); }

.item__foto {
  width: 64px; height: 64px; object-fit: cover;
  border-radius: var(--r-sm); background: var(--surface-2);
}

.item__texto { min-width: 0; }
.item__nombre { display: block; }
.item__desc {
  display: block; margin-top: 2px;
  font-size: .82rem; font-weight: 700; color: var(--text-faint);
}
.item__precio {
  display: block; margin-top: var(--sp-1);
  font-family: var(--font-mono); font-weight: 700; color: var(--acento);
}
.item__unidad { font-family: var(--font-body); font-size: .78rem; color: var(--text-faint); }

/* El stepper: mismo patrón que la venta rápida del SO. El − solo aparece
   cuando ya hay algo, para que la primera vez haya un solo botón que tocar. */
.stepper { display: flex; align-items: center; gap: var(--sp-1); }

.stepper__btn {
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  font-size: 1.5rem; line-height: 1;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-sm);
  -webkit-tap-highlight-color: transparent;
}
.stepper__btn:active { background: var(--acento); border-color: var(--acento); }
.stepper__btn--mas { color: var(--acento); }
.stepper__btn--mas:active { color: #fff; }

.stepper__cant {
  min-width: 30px; text-align: center;
  font-family: var(--font-mono); font-size: 1.05rem;
}

/* ---------- Estados de carga y error ---------- */

.aviso {
  margin: var(--sp-5) 0; padding: var(--sp-4);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); text-align: center;
}
.aviso h2 { font-size: 1.05rem; margin-bottom: var(--sp-2); }
.aviso p { margin: 0 0 var(--sp-3); font-size: .9rem; color: var(--text-dim); }
.aviso p:last-child { margin-bottom: 0; }

.esqueleto {
  height: 92px; margin-bottom: var(--sp-3);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md);
  animation: latir 1.2s ease-in-out infinite;
}
@keyframes latir { 0%, 100% { opacity: .45 } 50% { opacity: .9 } }

/* ---------- Barra inferior ---------- */

.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: var(--sp-3) var(--sp-4) calc(var(--sp-3) + var(--safe-b));
  background: rgba(22, 22, 26, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  transform: translateY(110%);
  transition: transform .2s ease-out;
}
.barra--visible { transform: none; }

.barra__interior { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: var(--sp-3); }
.barra__resumen { flex: 1; min-width: 0; }
.barra__items { display: block; font-size: .78rem; color: var(--text-dim); }
.barra__total { display: block; font-family: var(--font-mono); font-size: 1.25rem; }

.btn-primario {
  min-height: var(--tap); padding: 0 var(--sp-5);
  background: var(--acento); color: #fff;
  border-radius: var(--r-md); font-weight: 800;
  -webkit-tap-highlight-color: transparent;
}
.btn-primario:disabled { opacity: .5; }
.btn-primario--ancho { width: 100%; }

.btn-secundario {
  min-height: var(--tap); padding: 0 var(--sp-4); width: 100%;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-md); font-weight: 800;
}

.btn-wa {
  min-height: var(--tap); padding: 0 var(--sp-4); width: 100%;
  display: inline-grid; place-items: center;
  background: #25d366; color: #06301a;
  border-radius: var(--r-md); font-weight: 800; text-decoration: none;
}

/* ---------- Hoja del formulario ---------- */

.fondo {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(0, 0, 0, .6);
}

.hoja {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
  max-height: 92dvh; overflow-y: auto;
  background: var(--surface);
  border-top-left-radius: var(--r-lg); border-top-right-radius: var(--r-lg);
  border-top: 1px solid var(--border);
  padding: var(--sp-4) var(--sp-4) calc(var(--sp-5) + var(--safe-b));
  animation: subir .22s ease-out;
}
@keyframes subir { from { transform: translateY(100%) } to { transform: none } }

.hoja__interior { max-width: 560px; margin: 0 auto; }

.hoja__agarre {
  width: 40px; height: 4px; margin: 0 auto var(--sp-4);
  background: var(--border); border-radius: 999px;
}

.hoja h2 { font-size: 1.2rem; margin-bottom: var(--sp-4); }

.campo { margin-bottom: var(--sp-4); }
.campo > label {
  display: block; margin-bottom: var(--sp-2);
  font-size: .82rem; color: var(--text-dim);
}
.campo__opcional { color: var(--text-faint); font-weight: 700; }

.entrada {
  width: 100%; min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.entrada:focus { outline: 2px solid var(--acento); outline-offset: -1px; }
textarea.entrada { min-height: 76px; resize: vertical; }

/* Dos botones grandes: retirar y recibir son decisiones distintas, no un select */
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }

.opcion {
  min-height: 64px; padding: var(--sp-2);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-sm); text-align: center;
  font-size: .88rem;
}
.opcion small { display: block; font-size: .72rem; color: var(--text-faint); font-weight: 700; }
.opcion[aria-pressed="true"] {
  background: color-mix(in srgb, var(--acento) 18%, transparent);
  border-color: var(--acento); color: var(--text);
}
.opcion[aria-pressed="true"] small { color: var(--text-dim); }

.error {
  margin: 0 0 var(--sp-3); padding: var(--sp-2) var(--sp-3);
  background: color-mix(in srgb, var(--danger) 16%, transparent);
  border: 1px solid var(--danger); border-radius: var(--r-sm);
  font-size: .86rem;
}

.resumen {
  margin-bottom: var(--sp-4); padding: var(--sp-3);
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: .88rem;
}
.resumen__linea { display: flex; justify-content: space-between; gap: var(--sp-3); }
.resumen__linea + .resumen__linea { margin-top: var(--sp-1); }
.resumen__total {
  display: flex; justify-content: space-between; gap: var(--sp-3);
  margin-top: var(--sp-2); padding-top: var(--sp-2);
  border-top: 1px solid var(--border); font-size: 1rem;
}

/* El honeypot. Oculto para la gente, visible para un bot que llena todo. */
.trampa {
  position: absolute; left: -9999px;
  width: 1px; height: 1px; opacity: 0;
  pointer-events: none;
}

/* ---------- Confirmación ---------- */

.listo { padding: var(--sp-6) var(--sp-4) var(--sp-5); text-align: center; }
.listo__tilde {
  width: 68px; height: 68px; margin: 0 auto var(--sp-4);
  display: grid; place-items: center; font-size: 2rem;
  background: color-mix(in srgb, var(--ok) 18%, transparent);
  border: 2px solid var(--ok); border-radius: 50%;
}
.listo h2 { font-size: 1.35rem; margin-bottom: var(--sp-2); }
.listo__bajada { margin: 0 auto var(--sp-4); max-width: 32ch; font-size: .92rem; color: var(--text-dim); }
.listo__codigo {
  display: inline-block; margin-bottom: var(--sp-4);
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 1.1rem; letter-spacing: .1em;
}
.listo__acciones { display: flex; flex-direction: column; gap: var(--sp-2); max-width: 360px; margin: 0 auto; }

/* ---------- Pie ---------- */

.pie {
  margin-top: var(--sp-6); padding: var(--sp-5) var(--sp-4) calc(var(--sp-5) + var(--safe-b));
  border-top: 1px solid var(--border);
  text-align: center; font-size: .8rem; color: var(--text-faint);
}
.pie a { color: var(--text-dim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<div id="app">
  <header class="hero">
    <img class="hero__logo" src="../assets/logo-mark.png" alt="" width="72" height="72">
    <h1>Manos Libres</h1>
    <p class="hero__bajada">
      Cocina comunitaria. Comida casera hecha por gente del barrio.
    </p>
    <span class="hero__donde">CIC Barrio Movediza · Tandil</span>
  </header>

  <main class="envoltorio" id="catalogo" aria-live="polite">
    <div class="esqueleto"></div>
    <div class="esqueleto"></div>
    <div class="esqueleto"></div>
  </main>

  <footer class="pie envoltorio" id="pie">
    Un proyecto de la <strong>Federación Mesa Solidaria Tandil</strong>
    · coordinación de Mirmidones Asociación Civil
  </footer>
</div>

<div class="barra" id="barra" hidden>
  <div class="barra__interior">
    <div class="barra__resumen">
      <span class="barra__items" id="barra-items">Sin nada todavía</span>
      <span class="barra__total num" id="barra-total">$0</span>
    </div>
    <button class="btn-primario" id="ir-pedido" disabled>Hacer el pedido</button>
  </div>
</div>

<div class="fondo" id="fondo" hidden></div>

<section class="hoja" id="hoja" hidden aria-modal="true" role="dialog" aria-labelledby="hoja-titulo">
  <div class="hoja__interior">
    <div class="hoja__agarre"></div>
    <h2 id="hoja-titulo">Tus datos</h2>

    <div class="resumen" id="resumen"></div>

    <p class="error" id="error" hidden></p>

    <form id="form" novalidate>
      <div class="campo">
        <label for="f-nombre">Tu nombre</label>
        <input class="entrada" id="f-nombre" name="nombre" type="text"
               autocomplete="name" maxlength="80" required>
      </div>

      <div class="campo">
        <label for="f-tel">WhatsApp</label>
        <input class="entrada" id="f-tel" name="telefono" type="tel"
               inputmode="numeric" autocomplete="tel" placeholder="2494 55-1234" required>
        <span class="campo__opcional" style="font-size:.78rem">Sin el 0 ni el 15</span>
      </div>

      <div class="campo">
        <label id="lbl-entrega">¿Cómo lo recibís?</label>
        <div class="opciones" role="group" aria-labelledby="lbl-entrega">
          <button type="button" class="opcion" data-modo="retira_cic" aria-pressed="false">
            Retiro en el CIC
            <small>Barrio Movediza</small>
          </button>
          <button type="button" class="opcion" data-modo="domicilio" aria-pressed="false">
            Envío a domicilio
            <small>Sin cargo</small>
          </button>
        </div>
      </div>

      <div class="campo oculto" id="campo-dir">
        <label for="f-dir">Dirección</label>
        <input class="entrada" id="f-dir" name="direccion" type="text"
               autocomplete="street-address" maxlength="200"
               placeholder="Calle, número y entre calles">
      </div>

      <div class="campo">
        <label for="f-fecha">¿Para cuándo? <span class="campo__opcional">— opcional</span></label>
        <input class="entrada" id="f-fecha" name="fecha_deseada" type="date">
      </div>

      <div class="campo">
        <label for="f-notas">Comentario <span class="campo__opcional">— opcional</span></label>
        <textarea class="entrada" id="f-notas" name="notas" maxlength="500"
                  placeholder="Sin sal, para la tarde, lo que sea"></textarea>
      </div>

      <!-- Honeypot: si esto viene lleno, lo mandó un bot -->
      <div class="trampa" aria-hidden="true">
        <label for="f-empresa">No completar</label>
        <input id="f-empresa" name="empresa" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button class="btn-primario btn-primario--ancho" type="submit" id="enviar">
        Enviar el pedido
      </button>
    </form>
  </div>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
